name: Weekend auto-green

on:
  # GitHub Actions cron uses UTC. 0 = Sunday and 6 = Saturday.
  schedule:
    - cron: "0 0 * * 0,6"
  workflow_dispatch:
    inputs:
      message:
        description: "Commit message"
        required: false
        default: "chore: weekend contribution"
        type: string

permissions:
  contents: write

jobs:
  auto-green:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Create weekend contribution
        env:
          COMMIT_MESSAGE: ${{ inputs.message || 'chore: weekend contribution' }}
        run: |
          git config user.name "MountCoder-merry"
          git config user.email "MountCoder-merry@users.noreply.github.com"
          git commit --allow-empty -m "$COMMIT_MESSAGE"
          git push origin HEAD:main
